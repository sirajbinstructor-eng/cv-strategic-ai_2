name: Admin management CI
on:
  push:
    branches:
      - feature/admin-user-management
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-strategic-ai_enhanced
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cv-strategic-ai_enhanced/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx tsx --test tests/scoring.test.ts tests/admin-validation.test.ts
